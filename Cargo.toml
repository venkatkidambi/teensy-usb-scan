[package]
name = "teensy-usb-scan"
version = "0.1.5"
edition = "2024"
publish = false

[dependencies]
teensy4-bsp = { version = "0.6.0", features = ["rt"] }
cortex-m = "0.7"
usb-device = "0.3"
usbd-serial = "0.2"
static_cell = "2.1"
log = "0.4"

[build-dependencies]
cc = "1"

[profile.release]
debug = 2
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
