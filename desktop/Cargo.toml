[package]
name = "teensy-panel"
version = "0.2.0"
edition = "2024"
publish = false

# Keep host desktop dependencies out of the embedded firmware dependency graph.
[workspace]

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
smoke-test = []
bundled-release = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
